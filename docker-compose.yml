# ============================================================
# 校园墙 · 一键容器编排（评委最短路径：clone → docker compose up -d）
#
# 前置（首次，仅一次）：
#   1. 在项目根创建 .env：JWT_SECRET=$(openssl rand -hex 32)
#      （≥32 字符——镜像启动契约，生产缺省直接拒启，不回退开发密钥）
#   2. 覆盖管理员口令：docker compose run --rm web node -e "..."
#      —— 不需要，默认给演示值 demo-admin-2026，正式部署务必改
#
# 数据：./data 卷挂 /data（campus.db / uploads / backups），重启不丢；
# 想重置演示数据：docker compose down && rm -rf ./data/data.db* 后重来。
# ============================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-wall:latest
    container_name: campus-wall
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # SQLite + 上传 + 备份统一落数据卷；空库首启自动建表与超管账号
      DATA_DIR: /data
      DB_PATH: /data/campus.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      STORAGE_DRIVER: local
      # 直连发布端口时无反向代理，trust proxy 保持关闭（有反代时改 "1"）
      TRUST_PROXY: ${TRUST_PROXY:-0}
      WS_ENABLED: "1"
      LOG_TO_FILE: "0"
      # 同源部署（SPA 与 API 同端口），浏览器不触发跨域；保留显式配置防误判
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?缺 JWT_SECRET：请在项目根 .env 写入「JWT_SECRET=<openssl rand -hex 32 生成的 ≥32 字符值>」后重跑（docker compose 自动读取同目录 .env）}
      # 超管首启口令：演示默认值，正式部署必须经环境变量覆盖（db.ts 拒绝已知默认口令的残留面）
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-demo-admin-2026}
      # Web Push（VAPID_*/VAPID_SUBJECT）未配置时各子模块各自静默跳过，不影响运行
    volumes:
      - ./data:/data
    restart: unless-stopped
    # 镜像已带 HEALTHCHECK；此处再声明便于 compose ps 直接看探活状态
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3