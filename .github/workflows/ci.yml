name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [24.x]  # node:sqlite 需 ≥22.5；与本地开发环境(24)对齐

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 测试必须在「无预置数据库」的干净环境跑通：data.db 已在 .gitignore 中，
      # clone 后不存在，由 api/db.ts 首次启动自动建表。
      # 这一步本身就是对「评委 clone 下来能否跑起来」的验证。
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Tests (clean database, no seed)
        run: npm test
        env:
          NODE_ENV: test

      # 算法回归门：失物雷达的召回/误报/P@1 低于阈值即失败。
      # 让「智能匹配」有可复现指标，而不是靠口头描述。
      - name: Radar algorithm gate
        run: npm run eval:radar -- --gate

      - name: Build
        run: npm run build

      # 体积预算门：防止重依赖被随手带进首屏（阈值见 scripts/check-bundle-budget.mjs）
      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # 契约压测门：24 并发 × 20s，断言零 5xx/零连接错误 + 8 端点契约状态码全命中 + p95<800ms。
  # 独立临时库 + RATE_LIMIT_ENABLED=0（限流本身有单测覆盖，这里压的是服务端健康度）。
  load:
    name: Contract load gate
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start API (throwaway db, limiter off)
        run: |
          PORT=4101 HOST=127.0.0.1 NODE_ENV=development           DB_PATH=/tmp/lt.db UPLOAD_DIR=/tmp/lt-uploads           JWT_SECRET=ci-loadtest-secret-0123456789abcdef RATE_LIMIT_ENABLED=0 LOG_TO_FILE=0           npx tsx api/server.ts > /tmp/lt-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4101/api/health >/dev/null && break; sleep 1; done
      - name: Contract load test
        run: BASE=http://127.0.0.1:4101 DURATION=20 CONCURRENCY=24 npx tsx scripts/loadtest.mts
      - name: Server log on failure
        if: failure()
        run: tail -50 /tmp/lt-server.log
