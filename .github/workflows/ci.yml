name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [24.x]  # node:sqlite 需 ≥22.5；与本地开发环境(24)对齐

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 测试必须在「无预置数据库」的干净环境跑通：data.db 已在 .gitignore 中，
      # clone 后不存在，由 api/db.ts 首次启动自动建表。
      # 这一步本身就是对「评委 clone 下来能否跑起来」的验证。
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Tests (clean database, no seed)
        run: npm test
        env:
          NODE_ENV: test

      # 算法回归门：失物雷达的召回/误报/P@1 低于阈值即失败。
      # 让「智能匹配」有可复现指标，而不是靠口头描述。
      - name: Radar algorithm gate
        run: npm run eval:radar -- --gate

      - name: Build
        run: npm run build

      # 体积预算门：防止重依赖被随手带进首屏（阈值见 scripts/check-bundle-budget.mjs）
      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
