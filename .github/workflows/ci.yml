# 校园墙 CI：lint + typecheck + 单测 + 构建（D-T7）
# 基线 ≤ 12min 预算；better-sqlite3 在 node 20 ubuntu 有预编译产物，无需构建工具链
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests (api + web + mini)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E（5 条核心流，隔离库自动重建）
        run: npx playwright test

  # LHCI 性能预算（非阻塞：Lighthouse 分数天然波动，先观察基线再收紧/移除 continue-on-error）
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build
        run: npm run build

      - name: LHCI autorun
        run: npx --yes @lhci/cli@0.14.x autorun

  # 文档站构建（VitePress）：确保 docs/ 内容可构建（D-T10）
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build docs site
        run: npm run docs:build